<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create invoice</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <style>
                   *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        :root{
            --nav: #255267;
            --bg: #c6e3ea;
            --card: #f7fafd;
            --font: #2c434d;
            --border: #acb0b0;
            --button-bg: #d8ecf6;
        }


        body{
            display: flex;

        }

        main{
            width: 85%;
            height: 100%;
            position: absolute;
            left: 15%;
        }

        .nav{
            display: flex;
            flex-direction: column;
            background: #111827;
            height: 100vh;
            width: 15%;
            position: fixed;
            padding: 20px;
        }



        .user{
            display: flex;
            flex-direction: column;
            margin-top: 5%;
        }

        
          .sideNav a{
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .75rem 1rem;
      color: white;
      border-radius: var(--radius-sm);
      font-weight: 500;
      transition: var(--transition);
      text-decoration: none;
        }

    .sideNav { list-style: none; padding: 0 1rem; }

        .sideNav{
            margin-top: 40px;
            display: flex;
            flex-direction: column;
        }

        .sideNav a:hover,
        .sideNav a.active {
            background: rgba(59, 130, 246, .15);
            color: #fff;
        }




        .outline{
            background: rgba(255, 255, 255, 0.322);
            padding: 10px;
            border-radius: 7px;
            width: 160px;
            font-weight: 600;
            display: flex;
            align-items: center;
        }

        .user span{
            color: white;
            margin-bottom: 10px;
        }

         main .dash{
            display: flex;
            justify-content: space-between;
            padding-top: 20px;
            padding-bottom: 30px;
            padding-left: 40px;
            padding-right: 40px;
            margin-top: 10px;
            align-items: center;
        }

        .dash span{
        color: #111827;
        margin-bottom: 15px;
        font-size: 1.8rem;
        font-weight: 700;
        }

        .dash button, .a{
            width: 80px;
            height: 40px;
            background: none;
            color: gray;
            border-radius: 7px;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
        }

        .dash button{
            border: 2px solid gray;
        }

        .card{
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            margin-left: 40px;
            width: 1105px;
            height: 100vh;
            display: flex;
            justify-content: center;
            flex-direction: column;
            
            border-radius: 7px;
        }

        .basic{
            position: relative;
            width: 90%;
            height: 75vh;
            margin-top: 40px;
            border-radius: 7px;
            padding: 30px;
            margin-left: 5%;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .basic::before{
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 6px;
            height: 100%;
            background: #111827;
            border-top-left-radius: 6px;
            border-bottom-left-radius: 6px;
        }

        .top, .top2 span{
            color: #111827;
            margin-bottom: 15px;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .top2{
            margin-top: 50px;
        }

        .second{
            display: flex;
            flex-direction: row;
            gap: 20px;
            margin-top: 15px;
        }

        .finput{
            display: flex;
            flex-direction: column;
            
        }

        .finput input, .f1{
            width: 460px;
            height: 40px;
            border-radius: 7px;
            border: 1px solid grey;
        }



        .span1{
            margin-bottom: 10px;
            font-weight: 600;
        }

        .span2{
            margin-top: 5px;
            color: rgba(0, 0, 0, 0.47);
        }

        .last{
            display: flex;
            flex-direction: row;
            margin-top: 20px;
            align-items: center;
            gap: 20px;
        }
        .linput{
            display: flex;
            flex-direction: column;
        }

        .inp1, .f1{
            width: 460px;
            height: 40px;
            border-radius: 7px;
            border: 1px solid gray;
        }


        .f1{
            margin-top: 10px;
            font-weight: 600;
            padding-left: 20px ;
        }

        input, select::placeholder{
            padding: 20px;
            font-weight: 600;
        }

        .b1, .s{
            width: 90px;
            height: 40px;
            background: none;
            color: gray;
            border-radius: 7px;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
        }

        .b1{
            border: 2px solid gray;
        }

        .b2, .s2{
            width: 130px;
            height: 40px;
            background: #111827;
            color: white;
            border-radius: 7px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
        }

        .extra{
            margin-top: 40px;
            display: flex;
            gap: 10px;
            margin-left: 74.5%;
        }
    </style>
</head>
<body>
    <div class="nav">
        <div class="user">
           <span>Asare</span>
        </div>
        <div class="sideNav">
            <a class="link" href="dashboard.html"><i class="fa-solid fa-chart-bar" style="color: #ffffff;"></i>Dashboard</a>
            <a class="link" href="inventory.html"><i class="fa-solid fa-warehouse" style="color: #ffffff;"></i>Inventory</a>
            <a class="link" href="stock.html"><i class="fa-solid fa-arrow-trend-down" style="color: #ffffff;"></i>Low Stock</a>
            <a class="active" href="invoice.html"><i class="fas fa-receipt"></i>Invoices</a>
            <a class="link" href=""><i class="fa-solid fa-user" style="color: #ffffff;"></i>Customers</a>
           <a class="link" href=""><i class="fa-solid fa-chart-line" style="color: #ffffff;"></i>Report</a>
        </div>
    </div>
    <main>
        <div class="dash">
            <span>Create New Invoice</span>
            <a class="a" href="{% url 'inventory' %}">
                <button type="button">Back</button>
            </a>
        </div>
        <div class="card">
            <form method="post">
                {% csrf_token %}
                <section class="basic">
                    <div class="top">
                        <span>Basic Information</span>
                    </div>

                    <div class="second">
                        <div class="finput">
                            <span class="span1">Invoice number</span>
                            <input type="text" name="invo_num" placeholder="INV-2025-001">
                        </div>

                        <div class="finput">
                            <span class="span1">Invoice date</span>
                            <input type="date" name="invo_date">
                        </div>
                    </div>

                    <div class="last">
                        <div class="linput">
                            <span class="span1">Due Date</span>
                            <input class="inp1" type="date" name="due_date" placeholder="e.g, Chemicals">
                        </div>

                        <div class="linput2">
                            <span class="span1">Currency</span>
                            <select class="f1" name="selection">
                                <option value="">USD - US Dollar</option>
                                <option value="Draft">EUR - Euro</option>
                                <option value="Sent">GBP - British Pound</option>
                                <option value="Paid">GHS - Ghana Cedi</option>
                            </select>
                        </div>
                    </div>
                    <div class="top2">
                        <span>Company & Clients</span>
                    </div>
                    <div class="second">
                        <div class="finput">
                            <span class="span1">Your Company</span>
                            <input type="text" name="your_com" placeholder="Select Company">
                        </div>

                        <div class="finput">
                            <span class="span1">Client</span>
                            <input type="text" name="select_client" placeholder="Select Client">
                        </div>
                    </div>
                    
                </section>
                 <div class="extra">
                    <a href="{% url 'inventory' %}">
                        <button type="button" class="b1">Cancel</button>
                    </a>
                    <button type="submit" class="b2">Create Invoice</button>
                </div>
            </form>
        </div>

    </main>
</body>
</html>
