<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
                *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        :root{
            --nav: #255267;
            --bg: #c6e3ea;
            --card: #f7fafd;
            --font: #2c434d;
            --border: #acb0b0;
            --button-bg: #d8ecf6;
        }


        body{
            display: flex;

        }

        main{
            width: 85%;
            height: 100%;
            position: absolute;
            left: 15%;
        }

        .nav{
            display: flex;
            flex-direction: column;
            background: linear-gradient(45deg, #0a5ece , #042d70);
            height: 100vh;
            width: 15%;
            position: fixed;
            padding: 20px;
        }



        .user{
            display: flex;
            flex-direction: column;
            margin-top: 5%;
        }

        
        .sideNav a{
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: white;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .sideNav{
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }



        .outline{
            background: rgba(255, 255, 255, 0.322);
            padding: 10px;
            border-radius: 7px;
            width: 160px;
            font-weight: 600;
            display: flex;
            align-items: center;
        }

        main .dash{
            display: flex;
            justify-content: space-between;
            padding-top: 20px;
            padding-bottom: 30px;
            padding-left: 40px;
            padding-right: 40px;
            margin-top: 10px;
            align-items: center;
        }

        .dash span{
        color: #2c434d;
        margin-bottom: 15px;
        font-size: 1.8rem;
        font-weight: 700;
        }

        .dash button, .a{
            width: 150px;
            height: 40px;
            background: none;
            color: gray;
            border-radius: 7px;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
        }

        .dash button{
            border: 2px solid gray;
        }

        .user span{
            color: white;
            margin-bottom: 10px;
        }

        .link:hover{
            background: rgba(255, 255, 255, 0.322);
            border-radius: 7px;
            width: 160px;
            height: 40px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 2s;
        }

        .over-view{
            display: flex;
            width: 100%;
            background: #fff;
            margin-top: 20px;
            flex-direction: column;
            height: 25vh;
            border-radius: 7px;
        }

        .over-content{
            display: flex;
            flex-direction: row;
            margin-top: 10px;
            margin-left: 40px;
            gap: 20px;
        }

        .card{
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            padding: 20px;
            background: rgba(144, 238, 144, 0.048);
            display: flex;
            flex-direction: column;
            border-radius: 7px;
            width: 555px;
            align-items: center;
            height: 120px;
            justify-content: center;
        }

        .over-view label{
            margin-left: 20px;
            font-size: 20px;
            color: var(--font);
            font-weight: 600;
        }

        .yellow{
            color: yellow;
        }

        .num ,.yellow, .red{
            font-size: 25px;
            font-weight: 700;
        }

        .red{
            color: red;
        }        

        .red, .yellow{
            font-size: 40px;
            font-weight: 800;
        }

        .let{
            color: rgba(0, 0, 0, 0.518);
        }

        .head h2 {
        color: #2c434d;
        margin-bottom: 15px;
        font-size: 1.4rem;
        font-weight: 700;
        }

         table {
        width: 1105px;
        margin-left: 40px;
        border-collapse: collapse;
        border-radius: 7px;
        overflow: hidden;
        backdrop-filter: blur(15px);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        font-size: 15px;
        }

        th, td {
        padding: 14px 16px;
        text-align: left;
        }

        th {
        background: #0a5ece;
        
        color: white;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 13px;
        letter-spacing: 0.4px;
        }


        .head{
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-left: 40px;
            width: 1105px;
            padding: 10px;
        }

        .head input{
            width: 200px;
            height: 30px;
        }

        .head input::placeholder{
            padding: 20px;
        }

        .table{
            margin-top: 80px;
        }
    </style>
</head>
<body>
    <div class="nav">
        <div class="user">
           <span>Asare</span>
        </div>
        
        <div class="sideNav">
            <a class="link" href="{% url 'dashboard' %}">Dashboard</a>
            <a class="link" href="{% url 'inventory' %}"><i class="fa-solid fa-shelves" style="color: #d6e3ec;"></i>Inventory</a>
            <a class="outline" href="{% url 'stock' %}">Low Stock</a>
            <a class="link" href="">Creat Invoice</a>
            <a class="link" href="">Invoices</a>
            <a class="link" href="">Customers</a>
            <a class="link" href="">Sales Report</a>
            <a class="link" href="">Stock Report</a>
        </div>
    </div>
    <main>
        <div class="dash">
            <span>Low Stock Alert</span>
            <button><a class="a" href="{% url 'inventory' %}">Back to Inventory</a></button>
        </div>
        <div class="over-view">
            <div class="over-content">
                <div class="card">
                    <span class="let">Low Stock Items</span>
                    <span class="yellow">0</span>
                </div>
                <div class="card">
                    <span class="let">Out of stock</span>
                    <span class="red">0</span>
                </div>
            </div>
        </div>
        <div class="table">
            <div class="head">
                <h2>Products Needing Restock</h2>
                <input type="search" placeholder="Search">
            </div>
            <table>
                <tr>
                <th class="cr">PRODUCT</th>
                <th>SKU</th>
                <th>CATEGORY</th>
                <th>STOCK</th>
                <th>COST</th>
                <th>SELL</th>
                <th>STATUS</th>
                <th class="cr2">ACTION</th>
                </tr>

                <tr>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                </tr>
                <tr>

                </tr>
            </table>
        </div>
</body>
</html>
