<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/fontawesome.min.css">
    <style>
                   *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        :root{
            --nav: #255267;
            --bg: #c6e3ea;
            --card: #f7fafd;
            --font: #2c434d;
            --border: #acb0b0;
            --button-bg: #d8ecf6;
            --radius-sm: 8px;
            --transition: all .2s ease;
        }


        body{
            display: flex;

        }

        main{
            width: 85%;
            height: 100%;
            position: absolute;
            left: 15%;
        }

        .nav{
            display: flex;
            flex-direction: column;
            background: linear-gradient(45deg, #0a5ece , #042d70);
            height: 100vh;
            width: 15%;
            position: fixed;
            padding: 20px;
        }



        .user{
            display: flex;
            flex-direction: column;
            margin-top: 5%;
        }

        
        .sideNav a{
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .75rem 1rem;
      color: white;
      border-radius: var(--radius-sm);
      font-weight: 500;
      transition: var(--transition);
      text-decoration: none;
        }

    .sideNav { list-style: none; padding: 0 1rem; }

        .sideNav{
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .sideNav a:hover,
        .sideNav a.active {
            background: rgba(59, 130, 246, .15);
            color: #fff;
        }



        .outline{
            background: rgba(255, 255, 255, 0.322);
            padding: 10px;
            border-radius: 7px;
            width: 160px;
            font-weight: 600;
            display: flex;
            align-items: center;
        }

        .user span{
            color: white;
            margin-bottom: 10px;
        }
        main .dash{
            display: flex;
            justify-content: space-between;
            padding-top: 20px;
            padding-bottom: 30px;
            padding-left: 40px;
            padding-right: 40px;
            margin-top: 10px;
            align-items: center;
        }

        .dash span{
        color: #2c434d;
        margin-bottom: 15px;
        font-size: 1.8rem;
        font-weight: 700;
        }

        .dash button, .a{
            width: 130px;
            height: 40px;
            background: #0a5ece;
            color: white;
            border-radius: 5px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
        }

        .dash2 input{
            height: 40px;
            width: 220px;
            border-radius: 5px;
            border: 2px solid rgba(128, 128, 128, 0.352);
        }

        .dash2 input::placeholder{
            padding: 20px;
        }

    .over-view { display:flex; gap:.75rem; flex-wrap:wrap; margin-bottom:1rem; width:93.5%; margin-left: 40px;}
    .f1 { padding:.6rem 1rem; border:1.5px solid var(--border); border-radius:var(--radius-sm); background:#fff; font-size:.875rem; color:var(--text); cursor:pointer; transition:var(--transition); flex:1 1 150px; }
    .f1:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(59,130,246,.15); }

    table {
        width: 93.5%;
        margin-left: 40px;
        border-collapse: collapse;
        border-radius: 7px;
        overflow: hidden;
        backdrop-filter: blur(15px);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        font-size: 15px;
        }

        th, td {
        padding: 14px 16px;
        text-align: left;
        }

        th {
        background: #0a5ece;
        
        color: white;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 13px;
        letter-spacing: 0.4px;
        }
    </style>
</head>
<body>
    <div class="nav">
        <div class="user">
           <span>Asare</span>
        </div>
        
        <div class="sideNav">
            <a class="link" href="dashboard.html"><i class="fas fa-chart-bar "></i>Dashboard</a>
            <a class="link" href="inventory.html"><i class="fas fa-shelves"></i>Inventory</a>
            <a class="link" href="stock.html"><i class="fa fa-car"></i>Low Stock</a>
            <a class="link" href="create_invoice.html">Creat Invoice</a>
            <a class="active" href="invoice.html"><i class="fas fa-receipt"></i>Invoices</a>
            <a class="link" href="">Customers</a>
            <a class="link" href="">Sales Report</a>
            <a class="link" href="">Stock Report</a>
        </div>
    </div>
    <main>
        <div class="dash">
            <span>Invoice</span>
            <div class="dash2">
                <input type="search" placeholder="Search">
                <button><a class="a" href="create_invoice.html">Add Invoice</a></button>
            </div>    
        </div>
        <div class="over-view">
           <select class="f1">
                <option value="">All Status</option>
                <option value="Draft">Draft</option>
                <option value="Sent">Sent</option>
                <option value="Paid">Paid</option>
                <option value="Partial">Partial</option>
                <option value="Overdue">Overdue</option>
           </select>
           <select class="f1">
            <option value="">All Time</option>
            <option value="Last 7 Days">Last 7 Days</option>
            <option value="Last 30 Days">Last 30 Days</option>
            <option value="Last 90 Days">Last 90 Days</option>
           </select>
        </div>
        <div class="table">
            <table>
                <tr>
                <th class="cr">PRODUCT</th>
                <th>SKU</th>
                <th>CATEGORY</th>
                <th>STOCK</th>
                <th>COST</th>
                <th>SELL</th>
                <th>STATUS</th>
                <th class="cr2">ACTION</th>
                </tr>

                <tr>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                </tr>
                <tr>

                </tr>
            </table>
        </div>
    </main>
</body>
</html>
